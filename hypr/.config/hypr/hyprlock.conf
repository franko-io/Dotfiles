source = $HOME/.config/hypr/macchiato.conf

$font = JetBrainsMono Nerd Font

# GENERAL
general {
    hide_cursor = true
    ignore_empty_input = true
}

# ANIMATIONS
animations {
    enabled = true
}

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 4
    color = $base
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = $sky
    fade_on_empty = false
    font_family = $font
    placeholder_text = <i><span foreground="##$lavenderAlpha">Enter Pass</span></i>
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

# DAY-MONTH-DATE (now above time)
label {
    monitor =
    text = cmd[update:3600000] echo -e "$(date +"%A, %d %B")"
    color = $subtext0
    font_size = 30
    font_family = $font
    position = 0, 280
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = $subtext0
    font_size = 130
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}

# UPTIME
label {
    monitor =
    text = cmd[update:60000] awk '{h=int($1/3600); m=int(($1%3600)/60); printf "<b> UPTIME %dH%dM</b>", h, m}' /proc/uptime
    color = $subtext0
    font_size = 18
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hi, <span foreground="##$tealAlpha"><b>$USER</b></span>
    color = $text
    font_size = 25
    font_family = $font
    position = 0, -130
    halign = center
    valign = center
}

# AUTH
auth {
    fingerprint:enabled = true
}
